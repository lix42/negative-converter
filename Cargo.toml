[package]
name = "nc"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
image = "0.25.10"
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
# AV1 encoder for `io::avif`. The crate vendors libaom's source and links it
# statically with no network access, so the exact codec is pinned by
# `Cargo.lock` — the dependency shape `output/ultrahdr-dependency-externalization`
# wants, and the reason nc does not carry an in-repo libaom snapshot. nc writes
# the AVIF container itself (see `io::avif`), so no libavif dependency exists;
# the decoder half is a dev-dependency, since the product only ever encodes.
libaom-sys = { version = "0.17.2", default-features = false, features = [
    "av1_encoder",
] }
lcms2 = "6.1.1"
lcms2-sys = "4.0.7"
libc = "0.2"
palette = "0.7.6"
rayon = "1.12.0"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiff = "0.11.3"
# `jpeg-max-dimension` raises libultrahdr's compile-time `UHDR_MAX_DIMENSION` from
# its 8192 default to libjpeg-turbo's own `JPEG_MAX_DIMENSION` (65500), which the
# library's own `static_assert` names as the ceiling. Without it, packaging refuses
# any frame over 8192 px on a side — real 5000 dpi 35mm scans are 10368x7200 — and
# it refuses *after* the full render, as an exit-5 write error. It is an upstream
# build option, so no vendored source is patched and `check-vendored-native.py`
# still hashes the pristine snapshot.
ultrahdr-sys = { path = "vendor/ultrahdr-sys", default-features = false, features = [
    "vendored",
    "xmp",
    "jpeg-max-dimension",
] }

[dev-dependencies]
# Enables libaom's decoder for `io::avif`'s round-trip tests only. Resolver v3
# keeps dev-dependency features out of a plain `cargo build`, so the shipped
# binary stays encoder-only. Note this decoder shares an implementation with the
# encoder, so it verifies self-consistency, not conformance — the independent
# dav1d/`avifdec` decode the task requires belongs to the codec-bounds work.
libaom-sys = { version = "0.17.2", default-features = false, features = [
    "av1_decoder",
] }
# Reused by the e2e tests (same version as the runtime dep, so `Cargo.lock` is
# unchanged) to synthesize a near-opaque "reference leader" TIFF fixture on the
# fly: the real light-struck leader frames (Ektar/Phoenix) aren't committed, and
# the reference-Dmax path must be exercised with a realistic non-zero transmission
# (an all-zero region is now a hard error — see `algo::density::reference_dmax`).
tiff = "0.11.3"
